<!DOCTYPE html>
<html>
<head>
    <!-- <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" /> -->

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="commands.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
    body {
      background-color: #87CEEB; /* Sky blue */
      font-family: 'Segoe UI', sans-serif;
    }

    .container-box {
      background-color: #fff;
      max-width: 600px;
      margin: 60px auto;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .file-label {
      font-weight: 500;
    }

    .file-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #f8f9fa;
      padding: 10px 15px;
      border-radius: 6px;
      margin-bottom: 8px;
      transition: background-color 0.3s;
    }

    .file-list li:hover {
      background-color: #e0f7ff;
    }

    .delete-btn {
      color: #dc3545;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .delete-btn:hover {
      transform: scale(1.2);
      color: #a71d2a;
    }

    .file-btn {
      background: none;
      border: none;
      color: #007bff;
      font-weight: 500;
      cursor: pointer;
    }

    .file-btn:hover {
      text-decoration: underline;
      color: #0056b3;
    }
  </style>
</head>

<body>
    <div class="container container-box">
        <h3 class="mb-3">Select an IONAPI file:</h3>
        <div class="mb-4">
            <input type="file" class="form-control" id="fileInput" accept=".ionapi" />
        </div>
        <h4 class="mb-3">Uploaded Files:</h4>
        <!-- <select id="fileList" size="5" style="width: 300px;"></select> -->
        <nav style="margin-top: 0.5em;" onload="loadDropdown()">
            <ul class="file-list list-unstyled" id="dynamic-list">
            </ul>
        </nav>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
